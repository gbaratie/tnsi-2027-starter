[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filrouge"
version = "0.1.0"
description = "Starter applicatif du projet Fil Rouge - TNSI Dauphine 2027"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
rag = ["chromadb>=1.0.0"]
agent = ["mcp>=1.0.0,<2.0.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.32.0", "httpx>=0.27.0"]
graph = ["neo4j>=5.25.0"]
all = [
    "chromadb>=1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "neo4j>=5.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filrouge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
